<!DOCTYPE html>
<html>
<head>
    <title>Editor Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        #editor { width: 100%; height: 400px; border: 1px solid #ccc; padding: 10px; }
        #status { margin: 10px 0; padding: 10px; background: #f5f5f5; }
        .user { margin: 5px 0; }
        button { margin: 5px; padding: 10px; }
    </style>
</head>
<body>
    <h1>Real-time Editor Test</h1>
    <div id="status">Disconnected</div>
    
    <h3>Active Users:</h3>
    <div id="users"></div>
    
    <h3>Editor Content:</h3>
    <textarea id="editor" placeholder="Start typing..."></textarea>
    
    <div>
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
        <button onclick="save()">Save</button>
    </div>

    <script>
        let ws = null;
        let clientId = null;
        let rppId = '123'; // Test RPP ID
        
        // Test JWT token (you'll need to generate a real one)
        const token = 'eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJTaVJPVU0gQ0k0IiwiYXVkIjoiV2Vic29ja2V0IFNlcnZlciIsImlhdCI6MTc1NDI1MTAxNCwibmJmIjoxNzU0MjUxMDE0LCJleHAiOjE3NTQyNTQ2MTQsInVzZXJJZCI6IjMiLCJ0eXBlIjoid3MifQ.Twa6NPOwyyv56p6ownLQtkfQWFnnhLgCrR3cpr6puoM';
        
        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }
        
        function updateUsers(users) {
            const usersDiv = document.getElementById('users');
            usersDiv.innerHTML = users.map(user => 
                `<div class="user">👤 ${user.userName} (ID: ${user.clientId})</div>`
            ).join('');
        }
        
        function connect() {
            if (ws) return;
            
            const wsUrl = `ws://localhost:9950/editor/${rppId}?token=${token}`;
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                updateStatus('Connected to editor room: ' + rppId);
            };
            
            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                console.log('Received:', message);
                
                switch(message.type) {
                    case 'editor_init':
                        clientId = message.clientId;
                        document.getElementById('editor').value = message.data.content || '';
                        updateUsers(message.roomInfo.activeUsers);
                        break;
                    case 'editor_update':
                        document.getElementById('editor').value = message.data.content;
                        break;
                    case 'user_joined':
                        updateStatus(`User ${message.user} joined`);
                        break;
                    case 'user_left':
                        updateStatus(`User ${message.user} left`);
                        break;
                    case 'editor_saved':
                        updateStatus(`Content saved by ${message.data.userName}`);
                        break;
                    case 'pong':
                        console.log('Pong received');
                        break;
                }
            };
            
            ws.onclose = () => {
                updateStatus('Disconnected');
                ws = null;
                clientId = null;
            };
            
            ws.onerror = (error) => {
                updateStatus('Connection error: ' + error);
            };
        }
        
        function disconnect() {
            if (ws) {
                ws.close();
            }
        }
        
        function save() {
            if (!ws || !clientId) return;
            
            const content = document.getElementById('editor').value;
            ws.send(JSON.stringify({
                type: 'editor_save',
                data: { content }
            }));
        }
        
        // Send content changes
        document.getElementById('editor').addEventListener('input', (e) => {
            if (!ws || !clientId) return;
            
            ws.send(JSON.stringify({
                type: 'editor_change',
                data: { content: e.target.value }
            }));
        });
        
        // Send ping every 30 seconds
        setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'ping' }));
            }
        }, 30000);
    </script>
</body>
</html>
